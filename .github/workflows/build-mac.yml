name: Build macOS

# Gera o instalador (.dmg) do Me dá um Download para macOS, nas versões Apple
# Silicon (arm64) e Intel (x64), assinado com Developer ID e notarizado pela
# Apple. O resultado fica como artefato da execução, na aba Actions.
#
# As credenciais vêm dos secrets do repositório; o passo a passo para criá-las
# está em docs/mac-build.md.

on:
  push:
    tags: ['v*']
    # Enquanto a versão de Mac está em teste, cada push na branch "mac" gera
    # um instalador. Depois de juntar na main, esta linha pode sair.
    branches: ['mac']
    # Mudança só em texto (guias, README) ou no teste de abertura não precisa
    # de um instalador novo.
    paths-ignore: ['**.md', '.github/workflows/teste-mac.yml']
  # Botão "Run workflow" na aba Actions (aparece quando este arquivo estiver
  # na branch principal).
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Com "bash" pedido de forma explícita, um comando que falha no meio de
    # um "a | b" derruba o passo (sem isso, a falha passaria despercebida).
    shell: bash

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: Gerar .dmg
    # Runner Apple Silicon. A versão Intel sai da mesma máquina.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Com todos os secrets: assina e notariza. Sem nenhum (e fora de uma
      # tag): gera um instalador de teste, sem assinatura. Com só alguns, ou
      # numa tag sem eles: para aqui e diz o que falta.
      - name: Conferir credenciais
        id: credenciais
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          faltando=""
          presentes=0
          for nome in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [ -z "${!nome}" ]; then faltando="$faltando $nome"; else presentes=$((presentes + 1)); fi
          done

          if [ -z "$faltando" ]; then
            echo "assinar=true" >> "$GITHUB_OUTPUT"
            echo "sufixo=" >> "$GITHUB_OUTPUT"
          elif [ "$presentes" -eq 0 ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::warning title=Instalador sem assinatura::Nenhum secret cadastrado. O .dmg gerado serve só para teste: não está assinado nem notarizado. Veja docs/mac-build.md."
            echo "assinar=false" >> "$GITHUB_OUTPUT"
            echo "sufixo=-SEM-ASSINATURA" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Faltam secrets::Cadastre no repositório:$faltando (passo a passo em docs/mac-build.md)."
            exit 1
          fi

      # Confere, antes de gerar o app, se o certificado abre com a senha e se
      # o macOS deste runner aceita importá-lo. Se o formato do .p12 não for
      # aceito, regrava o mesmo certificado em outro formato e usa esse.
      - name: Preparar o certificado
        if: steps.credenciais.outputs.assinar == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          exec > >(tee "$RUNNER_TEMP/passo-certificado.log") 2>&1
          dir="$RUNNER_TEMP/certificado"
          mkdir -p "$dir"
          relatorio="$dir/relatorio.txt"
          : > "$relatorio"
          diz() { echo "$*" | tee -a "$relatorio"; }
          # O relatório vira uma anotação na página da execução (não contém
          # nenhum segredo: só tamanhos, impressões digitais e resultados).
          publicar() {
            node -e 'const t = require("fs").readFileSync(process.argv[1], "utf8").trim(); if (t) console.log("::notice title=Certificado::" + t.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A"));' "$relatorio" || true
          }
          trap publicar EXIT

          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const bruto = process.env.CSC_LINK || "";
            const limpo = bruto.replace(/\s+/g, "");
            const dados = Buffer.from(limpo, "base64");
            fs.writeFileSync(process.argv[1], dados);
            console.log("CSC_LINK: " + bruto.length + " caracteres em " + bruto.split(/\r?\n/).length + " linha(s); só base64: " + /^[A-Za-z0-9+\/=]+$/.test(limpo));
            console.log("Certificado: " + dados.length + " bytes, sha256 " + crypto.createHash("sha256").update(dados).digest("hex").slice(0, 16) + ", formato PKCS#12: " + (dados[0] === 0x30 && dados[1] === 0x82));
          ' "$dir/original.p12" | tee -a "$relatorio"
          diz "openssl do runner: $(openssl version)"

          # A senha pode ter sido colada com algo a mais (um espaço no fim, por
          # exemplo). Tenta as leituras possíveis e fica com a que abre o
          # certificado. O relatório só diz o formato da senha, nunca o valor.
          senha_como() {
            VARIANTE="$1" node -e '
              const bruta = (process.env.CSC_KEY_PASSWORD || "").replace(/[\r\n]+$/, "");
              const variantes = {
                "como-veio": bruta,
                "sem-espacos-nas-pontas": bruta.trim(),
                "primeira-palavra": bruta.trim().split(/\s+/)[0] || "",
                "so-letras-numeros-e-simbolos": bruta.replace(/[^\x21-\x7e]/g, ""),
              };
              process.stdout.write(variantes[process.env.VARIANTE] ?? bruta);
            '
          }
          node -e '
            const bruta = process.env.CSC_KEY_PASSWORD || "";
            const espacos = (bruta.match(/\s/g) || []).length;
            const estranhos = (bruta.match(/[^\x20-\x7e\s]/g) || []).length;
            console.log("Senha: " + bruta.length + " caracteres recebidos, " + bruta.trim().length + " sem os espaços das pontas; espaços ou quebras de linha: " + espacos + "; caracteres fora do teclado comum: " + estranhos + "; palavras: " + bruta.trim().split(/\s+/).length);
          ' | tee -a "$relatorio"

          # O contrário também acontece: o certificado ter sido gravado com uma
          # quebra de linha invisível no fim da senha (o arquivo de onde ela
          # foi lida terminava assim). Por isso cada leitura é testada também
          # com esse final. SENHA_ABRE é a que abre o arquivo como ele veio.
          variante=""
          sobra=""
          for tentativa in como-veio sem-espacos-nas-pontas primeira-palavra so-letras-numeros-e-simbolos; do
            for fim in "" $'\r' $'\n' $'\r\n'; do
              SENHA_ABRE="$(senha_como "$tentativa")$fim"
              export SENHA_ABRE
              if openssl pkcs12 -in "$dir/original.p12" -passin env:SENHA_ABRE -noout > "$dir/abrir.txt" 2>&1; then
                variante="$tentativa"
                sobra="$fim"
                break 2
              fi
            done
          done
          if [ -z "$variante" ]; then
            diz "O certificado NÃO abre com a senha: $(tail -1 "$dir/abrir.txt")"
            echo "::error title=Certificado e senha não combinam::O certificado do secret CSC_LINK não abre com a senha do secret CSC_KEY_PASSWORD. Cole de novo a senha, só a linha do valor."
            exit 1
          fi
          # Daqui em diante vale a senha "limpa", sem o final invisível.
          SENHA_P12="$(senha_como "$variante")"
          export SENHA_P12
          echo "::add-mask::$SENHA_P12"
          diz "O certificado abre com a senha (leitura: $variante)."
          if [ "$variante" != "como-veio" ]; then
            echo "::warning title=Senha com algo a mais::O secret CSC_KEY_PASSWORD tem caracteres além da senha. O build seguiu ignorando o excesso, mas vale colar o valor de novo."
          fi
          if [ -n "$sobra" ]; then
            diz "O .p12 foi gravado com uma quebra de linha invisível no fim da senha; ele será regravado com a senha sem ela."
            echo "::warning title=Certificado gravado com a senha errada::O arquivo .p12 foi criado com uma quebra de linha invisível no fim da senha. O build regrava o certificado com a senha certa a cada execução; para resolver de vez, gere o .p12 de novo e atualize o secret CSC_LINK."
          fi
          echo "SENHA_VARIANTE=$variante" >> "$GITHUB_ENV"

          # Importa o arquivo num chaveiro descartável: é o mesmo comando que
          # o electron-builder usa na hora de assinar.
          importa() {
            local chaveiro="$dir/teste.keychain-db" resultado=0
            security delete-keychain "$chaveiro" > /dev/null 2>&1 || true
            if ! security create-keychain -p teste "$chaveiro" > "$dir/import.txt" 2>&1 \
              || ! security unlock-keychain -p teste "$chaveiro" >> "$dir/import.txt" 2>&1; then
              diz "  não consegui criar o chaveiro de teste: $(tail -1 "$dir/import.txt")"
              return 1
            fi
            if security import "$1" -k "$chaveiro" -P "$SENHA_P12" -T /usr/bin/codesign > "$dir/import.txt" 2>&1; then
              diz "  identidades: $(security find-identity -p codesigning "$chaveiro" 2>&1 | grep -E "identities found|CSSMERR" | tr -s ' \n' ' ')"
            else
              resultado=1
              diz "  recusado: $(tail -1 "$dir/import.txt")"
            fi
            security delete-keychain "$chaveiro" > /dev/null 2>&1 || true
            return $resultado
          }
          # Regrava o certificado em outro formato e testa. $1 = nome; o resto
          # são as opções de formato do openssl.
          regrava() {
            local nome="$1"
            shift
            diz "Formato $nome:"
            if ! openssl pkcs12 -export -in "$dir/tudo.pem" -out "$dir/$nome.p12" -passout env:SENHA_P12 "$@" > "$dir/export.txt" 2>&1; then
              diz "  o openssl do runner não gera esse formato: $(tail -1 "$dir/export.txt")"
              return 1
            fi
            importa "$dir/$nome.p12"
          }

          escolhido=""
          # O arquivo original só serve como está se a senha dele for a limpa.
          if [ -z "$sobra" ]; then
            diz "Formato original:"
            if importa "$dir/original.p12"; then
              escolhido="$dir/original.p12"
            fi
          fi
          if [ -z "$escolhido" ]; then
            openssl pkcs12 -in "$dir/original.p12" -passin env:SENHA_ABRE -nodes -out "$dir/tudo.pem" > /dev/null 2>&1
            for formato in "3des-sha1 -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1" "padrao" "aes-sha256 -keypbe AES-256-CBC -certpbe AES-256-CBC -macalg sha256"; do
              # shellcheck disable=SC2086
              if regrava $formato; then
                escolhido="$dir/${formato%% *}.p12"
                break
              fi
            done
            rm -f "$dir/tudo.pem"
          fi

          if [ -z "$escolhido" ]; then
            echo "::error title=Certificado recusado pelo macOS::O certificado abre com a senha, mas o macOS deste runner não aceitou importá-lo em nenhum formato."
            exit 1
          fi
          diz "Certificado usado no build: ${escolhido##*/}"
          echo "P12_PRONTO=$escolhido" >> "$GITHUB_ENV"

      # A Apple só aceita a chave de API num arquivo .p8 "limpo": a linha
      # BEGIN, o conteúdo em linhas de 64 caracteres e a linha END. Este passo
      # monta esse arquivo a partir do secret, ignorando qualquer texto colado
      # junto, e confere se o resultado é mesmo uma chave.
      - name: Preparar a chave de notarização
        if: steps.credenciais.outputs.assinar == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          exec > >(tee "$RUNNER_TEMP/passo-chave.log") 2>&1
          arquivo="$RUNNER_TEMP/AuthKey.p8"
          relatorio="$RUNNER_TEMP/chave-relatorio.txt"
          # O relatório só fala do formato (quantas linhas, de que tamanho),
          # nunca do conteúdo, e vira uma anotação na página da execução.
          publicar() {
            node -e 'const t = require("fs").readFileSync(process.argv[1], "utf8").trim(); if (t) console.log("::notice title=Chave de notarização::" + t.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A"));' "$relatorio" || true
          }
          : > "$relatorio"
          trap publicar EXIT

          node -e '
            const fs = require("fs");
            const [arquivo, relatorio] = process.argv.slice(1);
            const bruto = process.env.APPLE_API_KEY_P8 || "";
            const linhas = bruto.split(/\r\n|\r|\n/);
            const relato = ["Chave recebida: " + bruto.length + " caracteres em " + linhas.length + " linha(s), de tamanhos " + linhas.map((l) => l.length).join(", ")];

            // Fica só com o que está entre a última linha BEGIN e a linha END.
            let corpo = bruto;
            let rotulo = "";
            let antes = null;
            const fim = [...bruto.matchAll(/-----END ([A-Z ]*)PRIVATE KEY-----/g)].pop();
            if (fim) {
              const ateOFim = bruto.slice(0, fim.index);
              const inicio = [...ateOFim.matchAll(/-----BEGIN ([A-Z ]*)PRIVATE KEY-----/g)].pop();
              if (inicio) {
                corpo = ateOFim.slice(inicio.index + inicio[0].length);
                rotulo = inicio[1];
                antes = inicio.index;
              }
            }
            corpo = corpo.replace(/[^A-Za-z0-9+\/=]/g, "");
            const bytes = Buffer.from(corpo, "base64");
            relato.push("Linhas BEGIN e END: " + (antes === null ? "não vieram" : "vieram, com " + antes + " caracteres de texto antes do BEGIN") + "; conteúdo: " + corpo.length + " caracteres, " + bytes.length + " bytes; parece uma chave: " + (bytes[0] === 0x30));
            const pem = "-----BEGIN " + rotulo + "PRIVATE KEY-----\n" + (corpo.match(/.{1,64}/g) || []).join("\n") + "\n-----END " + rotulo + "PRIVATE KEY-----\n";
            fs.writeFileSync(arquivo, pem, { mode: 0o600 });
            fs.writeFileSync(relatorio, relato.join("\n") + "\n");
          ' "$arquivo" "$relatorio"
          cat "$relatorio"

          if ! openssl pkey -in "$arquivo" -noout > "$RUNNER_TEMP/chave-erro.txt" 2>&1; then
            echo "A chave montada não é válida: $(tail -1 "$RUNNER_TEMP/chave-erro.txt")" | tee -a "$relatorio"
            echo "::error title=Chave de notarização inválida::O secret APPLE_API_KEY_P8 não contém uma chave válida. Cole de novo o conteúdo do arquivo .p8, da linha BEGIN PRIVATE KEY até a linha END PRIVATE KEY."
            exit 1
          fi
          echo "A chave é válida e foi gravada no formato que a Apple aceita." | tee -a "$relatorio"
          echo "APPLE_API_KEY_ARQUIVO=$arquivo" >> "$GITHUB_ENV"

      - name: Instalar dependências
        run: npm ci

      - name: Preparar o Cobalt
        run: npm run setup

      - name: Gerar, assinar e notarizar
        if: steps.credenciais.outputs.assinar == 'true'
        env:
          # O electron-builder lê estas variáveis: o certificado Developer ID
          # (o arquivo .p12 deixado pronto pelo passo "Preparar o certificado")
          # com a senha, e a chave de API do App Store Connect usada na
          # notarização (o arquivo .p8 deixado pronto pelo passo "Preparar a
          # chave de notarização", na pasta temporária do runner).
          CSC_LINK: ${{ env.P12_PRONTO }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_ARQUIVO }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Um espaço ou uma quebra de linha colados por engano junto com um
          # secret fariam a senha ou a chave serem recusadas. Para a senha vale
          # a leitura que o passo "Preparar o certificado" viu funcionar.
          sem_espacos() { printf '%s' "$1" | tr -d '[:space:]'; }
          CSC_KEY_PASSWORD="$(VARIANTE="${SENHA_VARIANTE:-como-veio}" node -e '
            const bruta = (process.env.CSC_KEY_PASSWORD || "").replace(/[\r\n]+$/, "");
            const variantes = {
              "como-veio": bruta,
              "sem-espacos-nas-pontas": bruta.trim(),
              "primeira-palavra": bruta.trim().split(/\s+/)[0] || "",
              "so-letras-numeros-e-simbolos": bruta.replace(/[^\x21-\x7e]/g, ""),
            };
            process.stdout.write(variantes[process.env.VARIANTE] ?? bruta);
          ')"
          APPLE_API_KEY_ID="$(sem_espacos "$APPLE_API_KEY_ID")"
          APPLE_API_ISSUER="$(sem_espacos "$APPLE_API_ISSUER")"
          for valor in "$CSC_KEY_PASSWORD" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER"; do
            echo "::add-mask::$valor"
          done

          # forceCodeSigning: se o certificado não servir, o electron-builder
          # para e diz por quê, em vez de gerar o app sem assinatura.
          npm run dist:mac -- -c.forceCodeSigning=true 2>&1 | tee "$RUNNER_TEMP/passo-gerar.log"

      - name: Gerar sem assinatura (só para teste)
        if: steps.credenciais.outputs.assinar != 'true'
        # Assinatura "ad-hoc": o app abre, mas o macOS avisa que não conhece
        # quem fez e pede uma liberação manual.
        run: npm run dist:mac -- -c.mac.identity=- -c.mac.hardenedRuntime=false 2>&1 | tee "$RUNNER_TEMP/passo-gerar.log"

      - name: Conferir assinatura e notarização
        if: steps.credenciais.outputs.assinar == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          exec > >(tee "$RUNNER_TEMP/passo-conferir.log") 2>&1
          equipe_esperada="$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')"
          for app in dist/mac*/*.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            # O app tem de sair assinado pela equipe do secret APPLE_TEAM_ID.
            equipe="$(codesign --display --verbose=2 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
            if [ "$equipe" != "$equipe_esperada" ]; then
              echo "::error title=Equipe diferente::O app foi assinado pela equipe \"$equipe\", que não é a do secret APPLE_TEAM_ID."
              exit 1
            fi
            codesign --display --verbose=2 "$app/Contents/Resources/cobalt/node_modules/ffmpeg-static/ffmpeg" 2>&1 | grep -E "Authority|TeamIdentifier|flags|Timestamp"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          done

      - name: Publicar os instaladores
        uses: actions/upload-artifact@v7
        with:
          name: MeDaUmDownload-mac${{ steps.credenciais.outputs.sufixo }}
          path: dist/*.dmg
          if-no-files-found: error

      # Confere, no app já montado, as partes que só existem no macOS: o modo
      # Node do Electron (usado pelo Cobalt e pelo yt-dlp), o ffmpeg embutido
      # e o servidor local do Cobalt.
      - name: Teste rápido do app gerado
        run: |
          exec > >(tee "$RUNNER_TEMP/passo-teste.log") 2>&1
          # Uso: testar <pasta do .app> [comando na frente, ex.: arch -x86_64]
          testar() {
            local app helper ffmpeg cobalt porta
            app="$(cd "$1" && pwd)"; shift
            helper=("$app"/Contents/Frameworks/*Helper.app)
            helper=("${helper[0]}"/Contents/MacOS/*)
            helper="${helper[0]}"
            cobalt="$app/Contents/Resources/cobalt"
            ffmpeg="$cobalt/node_modules/ffmpeg-static/ffmpeg"
            porta=9321

            echo "== $app"
            ELECTRON_RUN_AS_NODE=1 "$@" "$helper" -e "console.log('modo Node:', process.versions.node, process.arch)"
            "$@" "$ffmpeg" -version | sed -n 1p

            # O Cobalt fica no ar enquanto o "sleep" segurar a entrada dele.
            export API_URL="http://127.0.0.1:$porta/" API_PORT="$porta" API_LISTEN_ADDRESS=127.0.0.1
            ( cd "$cobalt" && sleep 25 | ELECTRON_RUN_AS_NODE=1 "$@" "$helper" run.mjs > "$RUNNER_TEMP/cobalt.log" 2>&1 ) &
            for tentativa in $(seq 1 40); do
              if curl -fsS -H "accept: application/json" "http://127.0.0.1:$porta/" > /dev/null 2>&1; then
                echo "Cobalt respondeu."
                wait || true
                return 0
              fi
              sleep 0.5
            done
            echo "::error::O Cobalt não respondeu dentro do app."
            cat "$RUNNER_TEMP/cobalt.log"
            return 1
          }

          apps=(dist/mac-arm64/*.app)
          testar "${apps[0]}"
          # A versão Intel roda pelo Rosetta, se o runner tiver.
          if arch -x86_64 /usr/bin/true 2> /dev/null; then
            apps=(dist/mac/*.app)
            testar "${apps[0]}" arch -x86_64
          else
            echo "Sem Rosetta neste runner: a versão Intel não foi executada aqui."
          fi

      # Se um dos passos acima falhar, o registro deles vira anotação no topo
      # da página da execução: dá para ver o erro sem abrir o log. Sai uma
      # anotação com o fim de cada registro e outra com as linhas do build
      # que falam de assinatura.
      - name: Resumir a falha
        if: failure()
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = process.argv[1];
            const anotar = (titulo, texto) => {
              if (!texto.trim()) return;
              const codificado = texto.slice(-6000).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
              console.log("::error title=" + titulo + "::" + codificado);
            };
            const registros = fs.readdirSync(dir)
              .filter((nome) => /^passo-.*\.log$/.test(nome))
              .map((nome) => ({ nome, quando: fs.statSync(path.join(dir, nome)).mtimeMs }))
              .sort((a, b) => a.quando - b.quando);
            for (const { nome } of registros) {
              const linhas = fs.readFileSync(path.join(dir, nome), "utf8")
                .replace(/\x1b\[[0-9;]*m/g, "")
                .split(/\r?\n/)
                .filter((linha) => linha.trim());
              if (nome === "passo-gerar.log") {
                const assinatura = linhas.filter((linha) => /sign|identit|notar|keychain|certific|Developer ID|CSSMERR/i.test(linha));
                anotar("Build: linhas sobre assinatura", assinatura.slice(0, 40).join("\n").slice(0, 6000));
              }
              anotar("Fim do registro: " + nome, linhas.join("\n"));
            }
          ' "$RUNNER_TEMP"

  # Quando a execução vem de uma tag, os instaladores também vão para a
  # release dessa tag no GitHub, que é de onde o site os baixa. Se a release
  # ainda não existir, ela é criada. Só este job pode escrever no repositório.
  publicar:
    name: Anexar à release
    needs: dmg
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Anexar os instaladores à release da tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name MeDaUmDownload-mac --dir instaladores
          ls -l instaladores

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" instaladores/*.dmg --clobber
          else
            {
              echo "Instaladores para macOS 13 (Ventura) ou mais novo, assinados e verificados pela Apple."
              echo
              echo "- O arquivo que termina em \`arm64.dmg\` é para Macs com chip Apple (M1 ou mais novo)."
              echo "- O arquivo que termina em \`x64.dmg\` é para Macs com processador Intel."
            } > notas.md
            # Uma release só de Mac (tag terminada em "-mac") não toma o lugar
            # da versão marcada como a mais recente, que tem o instalador de Windows.
            versao="${TAG#v}"
            titulo="Me dá um Download $versao"
            mais_recente=""
            case "$TAG" in
              *-mac*)
                mais_recente="--latest=false"
                titulo="Me dá um Download ${versao%%-mac*} para Mac"
                ;;
            esac
            # shellcheck disable=SC2086
            gh release create "$TAG" instaladores/*.dmg --verify-tag $mais_recente \
              --title "$titulo" --notes-file notas.md
          fi
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"'
